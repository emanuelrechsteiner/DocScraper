[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docscraper"
version = "0.1.0"
description = "Documentation Scraping & Post-Processing Toolkit"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.9.3",
    "requests>=2.25.1",
    "python-dotenv>=0.19.0",
    "openai>=1.0.0",
    "crawl4ai>=0.4.0",
    "playwright>=1.30.0",
    "aiohttp>=3.8.1",
    "typing-extensions>=4.0.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "networkx>=2.6.0",
    "aiofiles>=23.0.0"
]
readme = "README.md"

[project.scripts]
docscraper = "docscraper.cli.main:main"
docscraper-gui = "docscraper.gui.scraper_gui:main"
docprocessor-gui = "docscraper.gui.processor_gui:main"

[tool.setuptools.packages.find]
where = ["src"]
