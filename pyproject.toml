[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docscraper"
version = "0.1.0"
description = "Documentation Scraping & Post-Processing Toolkit"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.9.3",
    "requests>=2.25.1",
    "python-dotenv>=0.19.0",
    "openai>=1.0.0",
    "crawl4ai>=0.4.0",
    "playwright>=1.30.0",
    "aiohttp>=3.8.1",
    "typing-extensions>=4.0.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "networkx>=2.6.0",
    "aiofiles>=23.0.0"
]
readme = "README.md"

[project.scripts]
docscraper = "docscraper.cli.main:main"
docscraper-gui = "docscraper.gui.scraper_gui:main"
docprocessor-gui = "docscraper.gui.processor_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Minimal rule set for legacy codebase — focus on high-impact issues only.
# Stricter families (E/W/I/B/UP/DTZ/BLE/PLW/ASYNC) adopted incrementally.
select = ["F"]  # Only enforce: pyflakes (actual bugs)
ignore = ["E501"]  # long lines are not hard-enforced

# FastAPI uses Depends/Security in function defaults — this is the correct pattern
[tool.ruff.lint.per-file-ignores]
"api/**" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Put the repo root on sys.path so the top-level `api` package imports in any
# environment (CI included), not just when pytest's cwd magic happens to work.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Third-party packages without bundled type stubs (e.g. redis) are untyped.
disable_error_code = ["import-untyped"]
# The deployed API service is held to a stricter bar than the legacy library.
[[tool.mypy.overrides]]
module = "api.*"
disallow_untyped_defs = false
warn_return_any = false
[[tool.mypy.overrides]]
# src/ (legacy library) uses gradual typing — tightened over time, not blocking.
module = "docscraper.*"
ignore_errors = true
