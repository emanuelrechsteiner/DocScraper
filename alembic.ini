# Alembic configuration for Parsify async migrations.
# The database URL is intentionally left blank here; it is read at runtime
# from api.config.settings so that credentials never live in this file.

[alembic]
script_location = alembic

# Put the repository root on sys.path so env.py can import the `api` package
# (alembic does not add the invocation cwd automatically).
prepend_sys_path = .

# Blank — env.py reads the URL from settings.
sqlalchemy.url =

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
