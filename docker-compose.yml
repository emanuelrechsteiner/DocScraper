services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parsify
      POSTGRES_PASSWORD: parsify
      POSTGRES_DB: parsify
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parsify"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PARSIFY_DATABASE_URL: postgresql+asyncpg://parsify:parsify@postgres:5432/parsify
      PARSIFY_REDIS_URL: redis://redis:6379
      PARSIFY_DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: .
    environment:
      PARSIFY_DATABASE_URL: postgresql+asyncpg://parsify:parsify@postgres:5432/parsify
      PARSIFY_REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq api.workers.scrape_worker.WorkerSettings

volumes:
  pgdata:
