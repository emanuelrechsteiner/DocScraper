site_name: Parsify Documentation
site_description: Documentation scraping and processing REST API
site_url: https://parsify.dev
repo_url: https://github.com/emanuelgrammenos/DocScraper
repo_name: emanuelgrammenos/DocScraper

docs_dir: docs/site

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - API Reference: api-reference.md
  - Guides:
    - Authentication: guides/authentication.md
    - Webhooks: guides/webhooks.md
  - SDKs:
    - Python SDK: sdks/python.md
    - JavaScript SDK: sdks/javascript.md
  - Pricing: pricing.md
  - Changelog: changelog.md

plugins:
  - search
